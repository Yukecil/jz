<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#ffffff"/>
  
  <g transform="translate(56, 56) scale(0.75)">
    <!-- 钱包主体背景 -->
    <path d="M 45 150 L 230 55 L 415 150 L 450 360 C 455 400 430 440 380 440 L 80 440 C 35 440 15 400 20 360 Z" fill="#10b981" stroke="#1e3a8a" stroke-width="24" stroke-linejoin="round"/>
    
    <!-- 钱包翻盖 -->
    <path d="M 20 160 L 160 85 L 240 160 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="24" stroke-linejoin="round"/>
    
    <!-- 钱包扣子 -->
    <rect x="360" y="250" width="100" height="80" rx="20" fill="#10b981" stroke="#1e3a8a" stroke-width="20"/>
    <circle cx="420" cy="290" r="14" fill="#ffffff"/>

    <!-- 蓝色柱子 -->
    <rect x="100" y="260" width="50" height="90" rx="15" fill="#3b82f6"/>
    <!-- 绿色柱子 -->
    <rect x="180" y="210" width="50" height="140" rx="15" fill="#10b981"/>
    <!-- 橙色柱子 -->
    <rect x="260" y="140" width="50" height="210" rx="15" fill="#f59e0b"/>
    
    <!-- 上升的箭头 -->
    <path d="M 60 380 Q 200 380 320 220" fill="none" stroke="#1e3a8a" stroke-width="24" stroke-linecap="round"/>
    <path d="M 300 210 L 340 200 L 330 240 Z" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="10" stroke-linejoin="round"/>

    <!-- 金币 -->
    <circle cx="410" cy="120" r="55" fill="#fbbf24" stroke="#d97706" stroke-width="15"/>
    <text x="410" y="142" font-family="Arial, sans-serif" font-size="65" font-weight="bold" fill="#d97706" text-anchor="middle">¥</text>

    <!-- 星星 -->
    <path d="M 460 60 L 465 70 L 475 75 L 465 80 L 460 90 L 455 80 L 445 75 L 455 70 Z" fill="#fbbf24"/>
    <path d="M 380 40 L 385 50 L 395 55 L 385 60 L 380 70 L 375 60 L 365 55 L 375 50 Z" fill="#fbbf24"/>
  </g>

  <text x="256" y="460" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#2563eb" text-anchor="middle" letter-spacing="2">HeyYu</text>
</svg>
