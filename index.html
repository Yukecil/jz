<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 防止双击缩放，更像原生 App -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#34d399" />
  
  <!-- iOS 全屏及状态栏设置 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  
  <!-- 主屏幕显示的 App 名称 -->
  <meta name="apple-mobile-web-app-title" content="HeyYu" />
  
  <!-- 主屏幕显示的图标（确保同目录下有 apple-touch-icon.png） -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  
  <title>HeyYu</title>
  <style>
    :root {
      --bg-color: #f2f8f4;
      --card-bg: #ffffff;
      --primary-green: #2fb98a;
      --primary-hover: #26a37a;
      --header-bg: linear-gradient(135deg, #34d399 0%, #2dd4bf 55%, #22d3ee 100%);
      --accent-badge: #e6f7f2;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --income-color: #e65100;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: manipulation;
      background:
        radial-gradient(circle at 8% 8%, #dcfce7 0%, transparent 42%),
        radial-gradient(circle at 92% 12%, #fef3c7 0%, transparent 38%),
        radial-gradient(circle at 12% 92%, #e0f2fe 0%, transparent 42%),
        radial-gradient(circle at 88% 96%, #fce7f3 0%, transparent 38%),
        #f6faf7;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
      border-radius: 32px;
      box-shadow:
        0 22px 50px rgba(47, 185, 138, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset,
        0 0 0 4px rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      /* 增加底部内边距，避免内容被底栏遮挡 */
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      height: calc(100vh - 24px);
      height: calc(100dvh - 24px);
    }

    /* ---------- 顶栏（只留 Logo 和标题） ---------- */
    .top-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 18px 20px 14px;
      background: transparent;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-logo {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #fef3c7 0%, #fbcfe8 50%, #ddd6fe 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 6px 16px rgba(251, 191, 36, 0.35),
        0 0 0 3px #fff inset,
        0 0 0 1px rgba(255, 255, 255, 0.8);
      animation: floaty 4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .app-logo svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-3px) rotate(3deg); }
    }
    .app-name {
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "楷体", "Songti SC", "SimSun", serif;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      background: linear-gradient(120deg, #047857 0%, #10b981 42%, #f59e0b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(16, 185, 129, 0.18));
    }
    .app-sub {
      font-size: 11px;
      color: #9ca3af;
      letter-spacing: 3px;
      margin-top: 3px;
    }

    /* ---------- 月汇总卡片 ---------- */
    .dashboard-card {
      margin: 4px 0 14px;
      background: var(--header-bg);
      border-radius: 26px;
      padding: 18px 14px 16px;
      color: #fff;
      box-shadow:
        0 14px 32px rgba(45, 212, 191, 0.32),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -25%;
      width: 65%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.32), transparent 70%);
      pointer-events: none;
    }
    .date-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .date-selector .month-nav {
      background: rgba(255, 255, 255, 0.28);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.15s;
    }
    .date-selector .month-nav:active {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0.92);
    }
    .range-text {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    /* ---------- 汇总统计 4 项 ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      position: relative;
      z-index: 1;
      gap: 2px;
    }
    .stat-label {
      font-size: 10px;
      opacity: 0.92;
      margin-bottom: 3px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .stat-value {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      line-height: 1.2;
    }
    .stat-unit {
      font-size: 10px;
      font-weight: normal;
      opacity: 0.9;
      margin-left: 1px;
    }

    /* ---------- 日历 ---------- */
    .calendar-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 16px 14px;
      box-shadow: 0 8px 24px rgba(47, 185, 138, 0.08);
      border: 1px solid var(--border-color);
    }
    .week-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .day-cell {
      aspect-ratio: 0.82;
      border-radius: 14px;
      border: 1px solid #edf2f7;
      background: #fafbfc;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
    }
    .day-cell:active {
      transform: scale(0.93);
    }
    .day-cell:focus-visible {
      outline: 2px solid var(--primary-green);
      outline-offset: 1px;
    }
    .day-cell.other-month {
      opacity: 0.28;
      background: #f1f5f9;
    }
    .day-cell.today {
      border: 2px solid transparent;
      background:
        linear-gradient(#f0fdf4, #f0fdf4) padding-box,
        linear-gradient(135deg, #34d399, #22d3ee) border-box;
      box-shadow: 0 4px 10px rgba(45, 212, 191, 0.22);
    }
    .day-cell.today::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 6px;
      height: 6px;
      background: linear-gradient(135deg, #f87171, #fb7185);
      border-radius: 50%;
      box-shadow: 0 0 0 2px #fff;
    }
    .day-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
    }
    .work-badge {
      font-size: 9px;
      font-weight: 800;
      border-radius: 7px;
      padding: 1px 0;
      width: 100%;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .work-badge.day-shift {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #b45309;
    }
    .work-badge.night-shift {
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      color: #4338ca;
    }
    .work-badge.custom-shift {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #047857;
    }
    .income-text {
      font-size: 9px;
      line-height: 1.2;
      color: var(--income-color);
      font-weight: 700;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- 页面容器 ---------- */
    .page-section {
      display: none;
      padding: 0 14px 4px;
    }
    .page-section.active {
      display: block;
    }
    .stats-card-box {
      background: #fff;
      border-radius: 24px;
      padding: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(47, 185, 138, 0.06);
      margin-bottom: 14px;
    }
    .stats-card-box:first-child {
      margin-top: 4px;
    }

    /* ---------- 年度统计：5 项指标 ---------- */
    .year-stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .year-stat-item {
      grid-column: span 2;
      text-align: center;
      padding: 14px 6px;
      border-radius: 16px;
      background: linear-gradient(160deg, #f0fdf4, #ffffff);
      border: 1px solid #dcfce7;
    }
    .year-stat-item:nth-child(2) {
      background: linear-gradient(160deg, #fffbeb, #ffffff);
      border-color: #fde68a;
    }
    .year-stat-item:nth-child(3) {
      background: linear-gradient(160deg, #eff6ff, #ffffff);
      border-color: #bfdbfe;
    }
    .year-stat-item:nth-child(4),
    .year-stat-item:nth-child(5) {
      grid-column: span 3;
    }
    .year-stat-item:nth-child(4) {
      background: linear-gradient(160deg, #fffbeb, #ffffff);
      border-color: #fcd34d;
    }
    .year-stat-item:nth-child(5) {
      background: linear-gradient(160deg, #eef2ff, #ffffff);
      border-color: #a5b4fc;
    }
    .year-stat-num {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary-green);
      white-space: nowrap;
      line-height: 1.15;
    }
    .year-stat-unit {
      font-size: 11px;
      margin-left: 1px;
      opacity: 0.7;
    }
    .year-stat-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 5px;
      font-weight: 600;
    }

    /* 年份切换 */
    .year-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 6px;
    }
    .year-selector button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: linear-gradient(135deg, #f8fafc, #eef2f7);
      color: #475569;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .year-selector button:active {
      transform: scale(0.9);
      background: #eef2f7;
    }
    .year-selector span {
      font-size: 16px;
      font-weight: 800;
      color: #1f2937;
      min-width: 84px;
      text-align: center;
    }

    /* ---------- 毛玻璃各月明细入口 ---------- */
    .month-glass {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(209, 250, 229, 0.55), rgba(224, 242, 254, 0.5) 45%, rgba(254, 243, 199, 0.45) 100%);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 24px;
      padding: 18px;
      box-shadow:
        0 10px 32px rgba(47, 185, 138, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      margin-bottom: 14px;
    }
    .month-glass::before {
      content: "";
      position: absolute;
      top: -35%;
      right: -20%;
      width: 65%;
      height: 85%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 70%);
      pointer-events: none;
    }
    .month-glass h3 {
      font-size: 15px;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }
    .month-enter-btn {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(47, 185, 138, 0.12);
      transition: transform 0.15s, background 0.2s;
    }
    .month-enter-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.9);
    }
    .month-enter-main {
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .month-enter-hint {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* ---------- 设置入口（年度统计页底部） ---------- */
    .settings-entry-box {
      background: #fff;
      border-radius: 24px;
      padding: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(47, 185, 138, 0.06);
      margin-bottom: 14px;
    }
    .settings-entry-btn {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      border: 1.5px solid #bbf7d0;
      background: linear-gradient(150deg, #f0fdf4, #dcfce7);
      color: #166534;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.14);
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    .settings-entry-btn:active {
      transform: scale(0.97);
      background: linear-gradient(150deg, #dcfce7, #bbf7d0);
      box-shadow: 0 2px 6px rgba(34, 197, 94, 0.18);
    }

    /* ---------- 月份选择器 ---------- */
    .month-picker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .month-pick-item {
      padding: 14px 6px;
      border-radius: 16px;
      text-align: center;
      background: linear-gradient(160deg, #f0fdf4, #ffffff);
      border: 1px solid #dcfce7;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    .month-pick-item:hover {
      background: linear-gradient(160deg, #dcfce7, #ffffff);
    }
    .month-pick-item:active {
      transform: scale(0.94);
    }
    .month-pick-item:focus-visible {
      box-shadow: 0 0 0 2px var(--primary-green);
    }
    .month-pick-item.empty {
      background: linear-gradient(160deg, #f8fafc, #ffffff);
      border-color: #e2e8f0;
    }
    .month-pick-item.current {
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        linear-gradient(135deg, #34d399, #22d3ee) border-box;
      border: 1.5px solid transparent;
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.28);
    }
    .month-pick-num {
      font-size: 16px;
      font-weight: 900;
      color: #1f2937;
      line-height: 1.2;
    }
    .month-pick-hours {
      font-size: 11px;
      color: var(--primary-green);
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .month-pick-item.empty .month-pick-num {
      color: #94a3b8;
    }
    .month-pick-item.empty .month-pick-hours {
      color: #cbd5e1;
    }

    /* ---------- 月度详情弹窗 ---------- */
    .month-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 4px;
    }
    .md-item {
      padding: 12px 8px;
      border-radius: 14px;
      text-align: center;
      background: linear-gradient(160deg, #f8fafc, #ffffff);
      border: 1px solid var(--border-color);
    }
    .md-item.md-income {
      grid-column: span 2;
      background: linear-gradient(135deg, #ecfdf5, #f0fdfa);
      border-color: #a7f3d0;
    }
    .md-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .md-value {
      font-size: 18px;
      font-weight: 900;
      color: #1f2937;
      white-space: nowrap;
    }
    .md-income .md-value {
      color: #f59e0b;
      font-size: 24px;
    }

    /* ---------- 弹窗 ---------- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(2px);
    }
    .modal.active {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }
    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 380px;
      max-height: 86vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      animation: popIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #1f2937;
      text-align: center;
    }
    .modal-subtitle {
      font-size: 11px;
      color: var(--text-sub);
      text-align: center;
      margin-top: -8px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .current-log {
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border: 1px dashed #86efac;
      color: #15803d;
      font-size: 12px;
      font-weight: 700;
      border-radius: 14px;
      padding: 9px 12px;
      text-align: center;
      margin-bottom: 14px;
    }

    .btn-grid-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-small-action {
      padding: 14px 8px;
      border-radius: 18px;
      border: 1.5px solid var(--border-color);
      background: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      line-height: 1.3;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-small-action:active {
      transform: scale(0.95) translateY(1px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    .btn-small-action.day-btn {
      background: linear-gradient(150deg, #fffbeb, #fef3c7);
      border-color: #fcd34d;
      color: #b45309;
    }
    .btn-small-action.night-btn {
      background: linear-gradient(150deg, #eef2ff, #e0e7ff);
      border-color: #a5b4fc;
      color: #3730a3;
    }
    .btn-small-action.custom-btn {
      background: linear-gradient(150deg, #f0fdf4, #d1fae5);
      border-color: #86efac;
      color: #15803d;
    }
    .btn-small-action.danger-btn {
      background: linear-gradient(150deg, #fef2f2, #fee2e2);
      border-color: #fca5a5;
      color: #dc2626;
    }
    .btn-small-action.danger-btn.armed {
      background: linear-gradient(150deg, #ef4444, #dc2626);
      border-color: #dc2626;
      color: #fff;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
    }
    .sub-info {
      font-size: 10px;
      font-weight: normal;
      opacity: 0.85;
    }

    .form-group {
      margin-bottom: 11px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: #f9fafb;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary-green);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(47, 185, 138, 0.12);
    }
    .form-section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-green);
      margin: 14px 0 9px;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border-color);
    }
    .form-section-title:first-of-type {
      margin-top: 4px;
    }

    .data-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .data-actions .btn-small-action {
      padding: 11px 4px;
      font-size: 12px;
      border-radius: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    }
    .modal-actions button:active {
      transform: scale(0.96);
    }
    .btn-cancel {
      background: #f1f5f9;
      color: #64748b;
    }
    .btn-save {
      background: linear-gradient(135deg, #34d399, #2dd4bf);
      color: #fff;
      box-shadow: 0 6px 16px rgba(45, 212, 191, 0.32);
    }
    .btn-save:active {
      box-shadow: 0 3px 8px rgba(45, 212, 191, 0.4);
    }

    /* ---------- 底部导航 (纯文字，无图标) ---------- */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(68px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      padding-left: 24px;
      padding-right: 24px;
    }
    .nav-item {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px; /* 字体加大 */
      font-weight: 800;
      color: #94a3b8;
      cursor: pointer;
      padding: 12px 32px; /* 增大点击区域 */
      border-radius: 999px;
      transition: color 0.2s, background 0.25s, box-shadow 0.25s, transform 0.15s;
    }
    .nav-item:active {
      transform: scale(0.95);
    }
    .nav-item.active {
      color: #fff;
      background: linear-gradient(135deg, #34d399, #2dd4bf);
      box-shadow: 0 6px 16px rgba(45, 212, 191, 0.38);
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      background: rgba(31, 41, 55, 0.94);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200;
      max-width: 80vw;
      text-align: center;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
