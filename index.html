<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="theme-color" content="#fbfbf9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HeyYu" />
  
  <!-- 你提供的图床直链图标 -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://a1.ax1x.com/2026/11/09/wPJ6X.jpg" />
  
  <title>HeyYu 工时小账本</title>
  <style>
    :root {
      --bg-base: #fbfbf9;
      --bg-card: #ffffff;
      --border-color: #f0f0f0;
      --primary: #67c2a1;
      --primary-light: #e6f6f0;
      --accent-day: #fbbf24;
      --accent-night: #8b5cf6;
      --text-main: #333333;
      --text-sub: #999999;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      touch-action: manipulation;
      background: var(--bg-base);
      background-image:
        radial-gradient(circle at 10% 10%, rgba(103, 194, 161, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(251, 191, 36, 0.08) 0%, transparent 40%);
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid #f0f0f0;
      border-radius: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      height: calc(100vh - 20px);
      height: calc(100dvh - 20px);
    }

    .top-header {
      display: flex;
      align-items: center;
      padding: 16px 20px 10px;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-logo {
      width: 42px;
      height: 42px;
      background: var(--primary-light);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-logo svg {
      width: 28px;
      height: 28px;
      display: block;
    }
    .app-name {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--primary);
    }
    .app-sub {
      font-size: 10px;
      color: var(--text-sub);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* 顶部汇总卡片 */
    .dashboard-card {
      margin: 4px 16px 16px;
      background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
      border-radius: 24px;
      padding: 18px 16px;
      color: #2f4f4f;
      box-shadow: 0 8px 20px rgba(168, 230, 207, 0.3);
    }
    .date-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .month-nav {
      background: rgba(255, 255, 255, 0.6);
      border: none;
      color: #2f4f4f;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .month-nav:active { background: rgba(255, 255, 255, 0.9); }
    .range-text {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      gap: 4px;
    }
    .stat-label {
      font-size: 11px;
      color: rgba(47, 79, 79, 0.7);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      color: #2f4f4f;
    }
    .stat-value.income { color: #e67e22; }
    .stat-unit { font-size: 10px; opacity: 0.7; }

    /* 日历区域 */
    .calendar-card {
      margin: 0 16px;
      background: #ffffff;
      border-radius: 24px;
      padding: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
    }
    .week-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-cell {
      aspect-ratio: 0.8;
      border-radius: 12px;
      border: 1px solid transparent;
      background: #fafafa;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, background 0.2s;
    }
    .day-cell:active { transform: scale(0.92); }
    .day-cell.other-month { opacity: 0.2; background: transparent; }
    .day-cell.today {
      border: 1.5px solid var(--primary);
      background: var(--primary-light);
    }
    .day-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }
    .day-cell.today .day-num { color: var(--primary); }
    
    /* 糖果色打卡标签 */
    .work-badge {
      font-size: 9px;
      font-weight: 800;
      border-radius: 6px;
      padding: 1px 0;
      width: 100%;
      text-align: center;
    }
    .work-badge.day { background: #fef3c7; color: #d97706; }
    .work-badge.night { background: #e0e7ff; color: #4338ca; }
    .work-badge.custom { background: #d1fae5; color: #047857; }

    .income-text {
      font-size: 8px;
      color: #f97316;
      font-weight: 800;
    }

    /* 统计页 */
    .page-section { display: none; padding: 0 16px; }
    .page-section.active { display: block; }
    .stats-card-box {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      margin-bottom: 16px;
    }
    .year-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .year-selector button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: #fafafa;
      color: var(--text-main);
      font-weight: bold;
      cursor: pointer;
    }
    .year-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .year-stat-item {
      padding: 16px;
      border-radius: 16px;
      background: #fafafa;
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .year-stat-num {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
    }
    .year-stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 6px;
      font-weight: 600;
    }

    .settings-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .settings-btn:active { background: #d1fae5; }

    /* 底部导航 */
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: calc(66px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    .nav-item {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-sub);
      cursor: pointer;
      padding: 8px 36px;
      border-radius: 999px;
      transition: all 0.2s;
    }
    .nav-item.active {
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(103, 194, 161, 0.3);
    }

    /* 弹窗 (极简白底防卡顿) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 350px;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-main);
    }

    /* 快捷按钮 */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-action-quick {
      padding: 12px 6px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: #fafafa;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-action-quick:active { transform: scale(0.94); }
    .btn-action-quick.day { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .btn-action-quick.night { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; }
    .btn-action-quick.custom { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }

    /* 隐藏/显示的输入区域 */
    #customInputsArea {
      display: none; /* 默认隐藏 */
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-color);
    }

    /* 输入框 iOS 防放大 16px */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
      color: var(--text-main);
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--primary); background: #fff; }

    .backup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .btn-backup {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background: #fafafa;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
    }
    .btn-backup:active { background: #f0f0f0; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button {
      flex: 1; padding: 12px; border: none; border-radius: 14px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-cancel { background: #f0f0f0; color: var(--text-sub); }
    .btn-save { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(103, 194, 161, 0.3); }

    .toast {
      position: fixed;
      left: 50%; bottom: 84px;
      transform: translateX(-50%);
      background: rgba(51, 51, 51, 0.9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-header">
      <div class="app-title">
        <div class="app-logo">
          <svg viewBox="0 0 64 64" fill="none" stroke="#67c2a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 27 L9 9 L27 19 Z" fill="#a8e6cf"/>
            <path d="M50 27 L55 9 L37 19 Z" fill="#a8e6cf"/>
            <ellipse cx="32" cy="37" rx="20" ry="17.5" fill="#e6f6f0"/>
            <ellipse cx="25" cy="35" rx="3" ry="4" fill="#67c2a1" stroke="none"/>
            <ellipse cx="39" cy="35" rx="3" ry="4" fill="#67c2a1" stroke="none"/>
            <path d="M28 43 Q32 45 36 43" stroke="#67c2a1"/>
          </svg>
        </div>
        <div>
          <div class="app-name">HeyYu</div>
          <div class="app-sub">Work Log</div>
        </div>
      </div>
    </div>

    <!-- 主页/日历 -->
    <div id="calendarPage" class="page-section active">
      <div class="dashboard-card">
        <div class="date-selector">
          <button class="month-nav" id="prevMonthBtn">&lt;</button>
          <span class="range-text" id="monthRangeTitle">—</span>
          <button class="month-nav" id="nextMonthBtn">&gt;</button>
        </div>
        <div class="stats-grid">
          <div><div class="stat-label">总工时</div><div class="stat-value"><span id="totalHours">0</span><span class="stat-unit">h</span></div></div>
          <div><div class="stat-label">总收入</div><div class="stat-value income">¥<span id="totalIncome">0</span></div></div>
          <div><div class="stat-label">出勤</div><div class="stat-value"><span id="totalDays">0</span><span class="stat-unit">天</span></div></div>
          <div><div class="stat-label">补贴</div><div class="stat-value">¥<span id="totalSubsidy">0</span></div></div>
        </div>
      </div>

      <div class="calendar-card">
        <div class="week-header"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
        <div class="days-grid" id="daysGrid"></div>
      </div>
    </div>

    <!-- 统计页 -->
    <div id="statsPage" class="page-section">
      <div class="stats-card-box">
        <div class="year-selector">
          <button id="prevYearBtn">&lt;</button>
          <span id="currentYearTitle" style="font-weight:800; font-size:16px; color:var(--primary);">—</span>
          <button id="nextYearBtn">&gt;</button>
        </div>
        <div class="year-stats-grid">
          <div class="year-stat-item"><div class="year-stat-num"><span id="yearTotalHours">0</span>h</div><div class="year-stat-label">年度总工时</div></div>
          <div class="year-stat-item"><div class="year-stat-num" style="color:#f59e0b;">¥<span id="yearTotalIncome">0</span></div><div class="year-stat-label">年度总收入</div></div>
        </div>
      </div>
      <button class="settings-btn" id="openSettingsBtn">⚙️ 默认参数与数据管理</button>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <div class="nav-item active" data-target="calendarPage">主页</div>
      <div class="nav-item" data-target="statsPage">统计</div>
    </div>

    <!-- 打卡弹窗 -->
    <div class="modal" id="actionModal">
      <div class="modal-content">
        <div class="modal-title" id="actionModalTitle">每日打卡</div>
        
        <!-- 快捷打卡按钮 -->
        <div class="action-grid">
          <button class="btn-action-quick day" id="quickDayBtn">
            <span>☀️ 白班</span>
            <span style="font-size:10px;opacity:0.8;" id="quickDayDesc">8h</span>
          </button>
          <button class="btn-action-quick night" id="quickNightBtn">
            <span>🌙 夜班</span>
            <span style="font-size:10px;opacity:0.8;" id="quickNightDesc">8h</span>
          </button>
          <button class="btn-action-quick custom" id="quickCustomBtn">
            <span>✏️ 自定义</span>
            <span style="font-size:10px;opacity:0.8;">展开填写</span>
          </button>
        </div>

        <!-- 自定义输入区域（默认隐藏） -->
        <div id="customInputsArea">
          <div class="form-group"><label>工时 (小时)</label><input type="number" step="0.5" inputmode="decimal" id="inputHours" /></div>
          <div class="form-group"><label>时薪 (元/小时)</label><input type="number" step="0.5" inputmode="decimal" id="inputRate" /></div>
          <div class="form-group"><label>补贴 (元)</label><input type="number" step="1" inputmode="decimal" id="inputSubsidy" /></div>
        </div>
        
        <div class="modal-actions">
          <button class="btn-cancel" id="deleteBtn" style="color:#ef4444;">清除记录</button>
          <button class="btn-cancel" data-close="actionModal">取消</button>
          <button class="btn-save" id="saveBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- 设置与备份弹窗 -->
    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <div class="modal-title">默认参数与备份</div>
        <div class="form-group"><label>☀️ 白班默认工时</label><input type="number" step="0.5" inputmode="decimal" id="defDayHours" /></div>
        <div class="form-group"><label>☀️ 白班时薪 & 补贴</label><div style="display:flex;gap:10px;"><input type="number" step="0.5" inputmode="decimal" id="defDayRate" placeholder="时薪" /><input type="number" step="1" inputmode="decimal" id="defDaySubsidy" placeholder="补贴" /></div></div>
        
        <div class="form-group" style="margin-top:16px;"><label>🌙 夜班默认工时</label><input type="number" step="0.5" inputmode="decimal" id="defNightHours" /></div>
        <div class="form-group"><label>🌙 夜班时薪 & 补贴</label><div style="display:flex;gap:10px;"><input type="number" step="0.5" inputmode="decimal" id="defNightRate" placeholder="时薪" /><input type="number" step="1" inputmode="decimal" id="defNightSubsidy" placeholder="补贴" /></div></div>
        
        <div class="backup-actions">
          <button class="btn-backup" id="exportBtn">📥 导出备份</button>
          <button class="btn-backup" id="importBtn">📤 恢复数据</button>
        </div>
        <input type="file" id="importFile" accept="application/json" hidden />

        <div class="modal-actions" style="margin-top:20px;">
          <button class="btn-cancel" data-close="settingsModal">关闭</button>
          <button class="btn-save" id="saveSettings">保存默认</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, '0');
    const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    let logs = JSON.parse(localStorage.getItem('workLogs') || '{}');
    let dayCfg = JSON.parse(localStorage.getItem('dayCfg') || '{"hours":8,"rate":25,"subsidy":0}');
    let nightCfg = JSON.parse(localStorage.getItem('nightCfg') || '{"hours":8,"rate":30,"subsidy":20}');
    
    let now = new Date();
    let viewYear = now.getFullYear();
    let viewMonth = now.getMonth();
    let curDateStr = '';

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function renderCalendar() {
      $('monthRangeTitle').textContent = `${viewYear}年${viewMonth + 1}月`;
      const firstDay = new Date(viewYear, viewMonth, 1);
      const daysCount = new Date(viewYear, viewMonth + 1, 0).getDate();
      const offset = (firstDay.getDay() + 6) % 7;
      const total = Math.ceil((offset + daysCount) / 7) * 7;
      const todayStr = fmtDate(new Date());

      let tHours = 0, tIncome = 0, tDays = 0, tSubsidy = 0;
      const frag = document.createDocumentFragment();

      for (let i = 0; i < total; i++) {
        const d = new Date(viewYear, viewMonth, i - offset + 1);
        const ds = fmtDate(d);
        const isOther = d.getMonth() !== viewMonth;
        const log = logs[ds];

        if (!isOther && log && log.hours > 0) {
          tHours += log.hours;
          tIncome += log.hours * log.rate + (log.subsidy || 0);
          tSubsidy += (log.subsidy || 0);
          tDays++;
        }

        const cell = document.createElement('div');
        cell.className = `day-cell ${isOther ? 'other-month' : ''} ${ds === todayStr ? 'today' : ''}`;
        cell.dataset.date = ds;

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d.getDate();
        cell.appendChild(num);

        if (!isOther && log && log.hours > 0) {
          const typeClass = log.type || 'custom';
          const prefix = typeClass === 'day' ? '白' : typeClass === 'night' ? '夜' : '';
          
          const badge = document.createElement('div');
          badge.className = `work-badge ${typeClass}`;
          badge.textContent = `${prefix}${log.hours}h`;
          cell.appendChild(badge);

          const inc = document.createElement('div');
          inc.className = 'income-text';
          inc.textContent = `¥${log.hours*log.rate+(log.subsidy||0)}`;
          cell.appendChild(inc);
        }
        frag.appendChild(cell);
      }

      $('daysGrid').innerHTML = '';
      $('daysGrid').appendChild(frag);
      
      $('totalHours').textContent = tHours;
      $('totalIncome').textContent = tIncome;
      $('totalDays').textContent = tDays;
      $('totalSubsidy').textContent = tSubsidy;
    }

    function renderStats() {
      $('currentYearTitle').textContent = `${viewYear}年`;
      let yHours = 0, yIncome = 0;
      Object.keys(logs).forEach(ds => {
        if (ds.startsWith(String(viewYear))) {
          const l = logs[ds];
          if (l && l.hours > 0) {
            yHours += l.hours;
            yIncome += l.hours * l.rate + (l.subsidy || 0);
          }
        }
      });
      $('yearTotalHours').textContent = yHours;
      $('yearTotalIncome').textContent = yIncome;
    }

    // 点击日历格子打开弹窗
    $('daysGrid').addEventListener('click', e => {
      const cell = e.target.closest('.day-cell');
      if (!cell) return;
      curDateStr = cell.dataset.date;
      const log = logs[curDateStr] || {};
      
      $('actionModalTitle').textContent = `${curDateStr} 打卡`;
      $('quickDayDesc').textContent = `${dayCfg.hours}h`;
      $('quickNightDesc').textContent = `${nightCfg.hours}h`;

      // 重置自定义输入区域的显示状态
      $('customInputsArea').style.display = 'none';

      if (log.hours > 0) {
        // 如果有现有记录
        $('inputHours').value = log.hours;
        $('inputRate').value = log.rate;
        $('inputSubsidy').value = log.subsidy || '';
        // 如果是自定义记录，自动展开输入框
        if (log.type === 'custom') {
          $('customInputsArea').style.display = 'block';
        }
      } else {
        // 没有记录，预填默认白班数据备用
        $('inputHours').value = dayCfg.hours;
        $('inputRate').value = dayCfg.rate;
        $('inputSubsidy').value = dayCfg.subsidy || '';
      }
      
      $('actionModal').classList.add('active');
    });

    // 点击白班按钮：直接保存
    $('quickDayBtn').addEventListener('click', () => {
      $('inputHours').value = dayCfg.hours;
      $('inputRate').value = dayCfg.rate;
      $('inputSubsidy').value = dayCfg.subsidy;
      saveLog('day');
    });

    // 点击夜班按钮：直接保存
    $('quickNightBtn').addEventListener('click', () => {
      $('inputHours').value = nightCfg.hours;
      $('inputRate').value = nightCfg.rate;
      $('inputSubsidy').value = nightCfg.subsidy;
      saveLog('night');
    });

    // 点击自定义按钮：展开输入区域
    $('quickCustomBtn').addEventListener('click', () => {
      const log = logs[curDateStr];
      // 如果当前记录是白班/夜班，点击自定义时，把当前参数带过来方便修改
      if (log && log.type !== 'custom' && log.hours > 0) {
        $('inputHours').value = log.hours;
        $('inputRate').value = log.rate;
        $('inputSubsidy').value = log.subsidy || '';
      }
      $('customInputsArea').style.display = 'block';
      $('inputHours').focus();
    });

    function saveLog(type) {
      const hours = parseFloat($('inputHours').value);
      if (!hours || hours <= 0) {
        toast('请输入有效工时');
        return;
      }
      logs[curDateStr] = {
        type: type,
        hours: hours,
        rate: parseFloat($('inputRate').value) || 0,
        subsidy: parseFloat($('inputSubsidy').value) || 0
      };
      localStorage.setItem('workLogs', JSON.stringify(logs));
      $('actionModal').classList.remove('active');
      renderCalendar();
      toast('打卡成功');
    }

    // 底部保存按钮：默认保存为自定义
    $('saveBtn').addEventListener('click', () => {
      saveLog('custom');
    });

    // 清除记录
    $('deleteBtn').addEventListener('click', () => {
      delete logs[curDateStr];
      localStorage.setItem('workLogs', JSON.stringify(logs));
      $('actionModal').classList.remove('active');
      renderCalendar();
      toast('记录已清除');
    });

    $('prevMonthBtn').addEventListener('click', () => { viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderCalendar(); });
    $('nextMonthBtn').addEventListener('click', () => { viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderCalendar(); });

    $('prevYearBtn').addEventListener('click', () => { viewYear--; renderStats(); });
    $('nextYearBtn').addEventListener('click', () => { viewYear++; renderStats(); });

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        item.classList.add('active');
        const target = item.dataset.target;
        $(target).classList.add('active');
        if (target === 'statsPage') renderStats();
        else renderCalendar();
      });
    });

    $('openSettingsBtn').addEventListener('click', () => {
      $('defDayHours').value = dayCfg.hours;
      $('defDayRate').value = dayCfg.rate;
      $('defDaySubsidy').value = dayCfg.subsidy;
      
      $('defNightHours').value = nightCfg.hours;
      $('defNightRate').value = nightCfg.rate;
      $('defNightSubsidy').value = nightCfg.subsidy;
      
      $('settingsModal').classList.add('active');
    });

    $('saveSettings').addEventListener('click', () => {
      dayCfg = {
        hours: parseFloat($('defDayHours').value) || 0,
        rate: parseFloat($('defDayRate').value) || 0,
        subsidy: parseFloat($('defDaySubsidy').value) || 0
      };
      nightCfg = {
        hours: parseFloat($('defNightHours').value) || 0,
        rate: parseFloat($('defNightRate').value) || 0,
        subsidy: parseFloat($('defNightSubsidy').value) || 0
      };
      localStorage.setItem('dayCfg', JSON.stringify(dayCfg));
      localStorage.setItem('nightCfg', JSON.stringify(nightCfg));
      $('settingsModal').classList.remove('active');
      toast('默认参数已更新');
    });

    $('exportBtn').addEventListener('click', () => {
      const data = {
        version: 2,
        exportedAt: new Date().toISOString(),
        dayCfg: dayCfg,
        nightCfg: nightCfg,
        logs: logs
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `HeyYu-Backup-${fmtDate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('备份文件已导出');
    });

    $('importBtn').addEventListener('click', () => $('importFile').click());

    $('importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const json = JSON.parse(event.target.result);
          if (!json.logs || typeof json.logs !== 'object') throw new Error();
          if (confirm(`确定要从备份中恢复数据吗？这将覆盖当前的全部记录。`)) {
            logs = json.logs;
            if (json.dayCfg) dayCfg = json.dayCfg;
            if (json.nightCfg) nightCfg = json.nightCfg;
            localStorage.setItem('workLogs', JSON.stringify(logs));
            localStorage.setItem('dayCfg', JSON.stringify(dayCfg));
            localStorage.setItem('nightCfg', JSON.stringify(nightCfg));
            renderCalendar();
            $('settingsModal').classList.remove('active');
            toast('数据恢复成功');
          }
        } catch (err) {
          toast('导入失败：文件格式不正确');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => $(btn.dataset.close).classList.remove('active'));
    });

    renderCalendar();
  })();
  </script>
</body>
</html>
