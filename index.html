<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#34d399" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HeyYu" />
  <link rel="apple-touch-icon" sizes="any" href="./apple-touch-icon.svg" />
  <title>HeyYu</title>
  <style>
    :root {
      --bg-color: #f2f8f4;
      --card-bg: #ffffff;
      --primary-green: #2fb98a;
      --primary-hover: #26a37a;
      --header-bg: linear-gradient(135deg, #34d399 0%, #2dd4bf 55%, #22d3ee 100%);
      --accent-badge: #e6f7f2;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --income-color: #e65100;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: manipulation;
      background:
        radial-gradient(circle at 8% 8%, #dcfce7 0%, transparent 42%),
        radial-gradient(circle at 92% 12%, #fef3c7 0%, transparent 38%),
        radial-gradient(circle at 12% 92%, #e0f2fe 0%, transparent 42%),
        radial-gradient(circle at 88% 96%, #fce7f3 0%, transparent 38%),
        #f6faf7;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
      border-radius: 32px;
      box-shadow:
        0 22px 50px rgba(47, 185, 138, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset,
        0 0 0 4px rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      height: calc(100vh - 24px);
      height: calc(100dvh - 24px);
    }

    .top-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 18px 20px 14px;
      background: transparent;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-logo {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #fef3c7 0%, #fbcfe8 50%, #ddd6fe 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 6px 16px rgba(251, 191, 36, 0.35),
        0 0 0 3px #fff inset,
        0 0 0 1px rgba(255, 255, 255, 0.8);
      animation: floaty 4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .app-logo svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-3px) rotate(3deg); }
    }
    .app-name {
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "楷体", "Songti SC", "SimSun", serif;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      background: linear-gradient(120deg, #047857 0%, #10b981 42%, #f59e0b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(16, 185, 129, 0.18));
    }
    .app-sub {
      font-size: 11px;
      color: #9ca3af;
      letter-spacing: 3px;
      margin-top: 3px;
    }

    .dashboard-card {
      margin: 4px 0 14px;
      background: var(--header-bg);
      border-radius: 26px;
      padding: 18px 14px 16px;
      color: #fff;
      box-shadow:
        0 14px 32px rgba(45, 212, 191, 0.32),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -25%;
      width: 65%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.32), transparent 70%);
      pointer-events: none;
    }
    .date-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .date-selector .month-nav {
      background: rgba(255, 255, 255, 0.28);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.15s;
    }
    .date-selector .month-nav:active {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0.92);
    }
    .range-text {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      position: relative;
      z-index: 1;
      gap: 2px;
    }
    .stat-label {
      font-size: 10px;
      opacity: 0.92;
      margin-bottom: 3px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .stat-value {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      line-height: 1.2;
    }
    .stat-unit {
      font-size: 10px;
      font-weight: normal;
      opacity: 0.9;
      margin-left: 1px;
    }

    .calendar-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 16px 14px;
      box-shadow: 0 8px 24px rgba(47, 185, 138, 0.08);
      border: 1px solid var(--border-color);
    }
    .week-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .day-cell {
      aspect-ratio: 0.82;
      border-radius: 14px;
      border: 1px solid #edf2f7;
      background: #fafbfc;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
    }
    .day-cell:active {
      transform: scale(0.93);
    }
    .day-cell:focus-visible {
      outline: 2px solid var(--primary-green);
      outline-offset: 1px;
    }
    .day-cell.other-month {
      opacity: 0.28;
      background: #f1f5f9;
    }
    .day-cell.today {
      border: 2px solid transparent;
      background:
        linear-gradient(#f0fdf4, #f0fdf4) padding-box,
        linear-gradient(135deg, #34d399, #22d3ee) border-box;
      box-shadow: 0 4px 10px rgba(45, 212, 191, 0.22);
    }
    .day-cell.today::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 6px;
      height: 6px;
      background: linear-gradient(135deg, #f87171, #fb7185);
      border-radius: 50%;
      box-shadow: 0 0 0 2px #fff;
    }
    .day-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
    }
    .work-badge {
      font-size: 9px;
      font-weight: 800;
      border-radius: 7px;
      padding: 1px 0;
      width: 100%;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .work-badge.day-shift {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #b45309;
    }
    .work-badge.night-shift {
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      color: #4338ca;
    }
    .work-badge.custom-shift {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #047857;
    }
    .income-text {
      font-size: 9px;
      line-height: 1.2;
      color: var(--income-color);
      font-weight: 700;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-section {
      display: none;
      padding: 0 14px 4px;
    }
    .page-section.active {
      display: block;
    }
    .stats-card-box {
      background: #fff;
      border-radius: 24px;
      padding: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(47, 185, 138, 0.06);
      margin-bottom: 14px;
    }
    .stats-card-box:first-child {
      margin-top: 4px;
    }

    .year-stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .year-stat-item {
      grid-column: span 2;
      text-align: center;
      padding: 14px 6px;
      border-radius: 16px;
      background: linear-gradient(160deg, #f0fdf4, #ffffff);
      border: 1px solid #dcfce7;
    }
    .year-stat-item:nth-child(2) {
      background: linear-gradient(160deg, #fffbeb, #ffffff);
      border-color: #fde68a;
    }
    .year-stat-item:nth-child(3) {
      background: linear-gradient(160deg, #eff6ff, #ffffff);
      border-color: #bfdbfe;
    }
    .year-stat-item:nth-child(4),
    .year-stat-item:nth-child(5) {
      grid-column: span 3;
    }
    .year-stat-item:nth-child(4) {
      background: linear-gradient(160deg, #fffbeb, #ffffff);
      border-color: #fcd34d;
    }
    .year-stat-item:nth-child(5) {
      background: linear-gradient(160deg, #eef2ff, #ffffff);
      border-color: #a5b4fc;
    }
    .year-stat-num {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary-green);
      white-space: nowrap;
      line-height: 1.15;
    }
    .year-stat-unit {
      font-size: 11px;
      margin-left: 1px;
      opacity: 0.7;
    }
    .year-stat-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 5px;
      font-weight: 600;
    }

    .year-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 6px;
    }
    .year-selector button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: linear-gradient(135deg, #f8fafc, #eef2f7);
      color: #475569;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .year-selector button:active {
      transform: scale(0.9);
      background: #eef2f7;
    }
    .year-selector span {
      font-size: 16px;
      font-weight: 800;
      color: #1f2937;
      min-width: 84px;
      text-align: center;
    }

    .month-glass {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(209, 250, 229, 0.55), rgba(224, 242, 254, 0.5) 45%, rgba(254, 243, 199, 0.45) 100%);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 24px;
      padding: 18px;
      box-shadow:
        0 10px 32px rgba(47, 185, 138, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      margin-bottom: 14px;
    }
    .month-glass::before {
      content: "";
      position: absolute;
      top: -35%;
      right: -20%;
      width: 65%;
      height: 85%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 70%);
      pointer-events: none;
    }
    .month-glass h3 {
      font-size: 15px;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }
    .month-enter-btn {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(47, 185, 138, 0.12);
      transition: transform 0.15s, background 0.2s;
    }
    .month-enter-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.9);
    }
    .month-enter-main {
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .month-enter-hint {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .settings-entry-box {
      background: #fff;
      border-radius: 24px;
      padding: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(47, 185, 138, 0.06);
      margin-bottom: 14px;
    }
    .settings-entry-btn {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      border: 1.5px solid #bbf7d0;
      background: linear-gradient(150deg, #f0fdf4, #dcfce7);
      color: #166534;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.14);
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    .settings-entry-btn:active {
      transform: scale(0.97);
      background: linear-gradient(150deg, #dcfce7, #bbf7d0);
      box-shadow: 0 2px 6px rgba(34, 197, 94, 0.18);
    }

    .month-picker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .month-pick-item {
      padding: 14px 6px;
      border-radius: 16px;
      text-align: center;
      background: linear-gradient(160deg, #f0fdf4, #ffffff);
      border: 1px solid #dcfce7;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    .month-pick-item:hover {
      background: linear-gradient(160deg, #dcfce7, #ffffff);
    }
    .month-pick-item:active {
      transform: scale(0.94);
    }
    .month-pick-item:focus-visible {
      box-shadow: 0 0 0 2px var(--primary-green);
    }
    .month-pick-item.empty {
      background: linear-gradient(160deg, #f8fafc, #ffffff);
      border-color: #e2e8f0;
    }
    .month-pick-item.current {
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        linear-gradient(135deg, #34d399, #22d3ee) border-box;
      border: 1.5px solid transparent;
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.28);
    }
    .month-pick-num {
      font-size: 16px;
      font-weight: 900;
      color: #1f2937;
      line-height: 1.2;
    }
    .month-pick-hours {
      font-size: 11px;
      color: var(--primary-green);
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .month-pick-item.empty .month-pick-num {
      color: #94a3b8;
    }
    .month-pick-item.empty .month-pick-hours {
      color: #cbd5e1;
    }

    .month-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 4px;
    }
    .md-item {
      padding: 12px 8px;
      border-radius: 14px;
      text-align: center;
      background: linear-gradient(160deg, #f8fafc, #ffffff);
      border: 1px solid var(--border-color);
    }
    .md-item.md-income {
      grid-column: span 2;
      background: linear-gradient(135deg, #ecfdf5, #f0fdfa);
      border-color: #a7f3d0;
    }
    .md-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .md-value {
      font-size: 18px;
      font-weight: 900;
      color: #1f2937;
      white-space: nowrap;
    }
    .md-income .md-value {
      color: #f59e0b;
      font-size: 24px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(2px);
    }
    .modal.active {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }
    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 380px;
      max-height: 86vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      animation: popIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #1f2937;
      text-align: center;
    }
    .modal-subtitle {
      font-size: 11px;
      color: var(--text-sub);
      text-align: center;
      margin-top: -8px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .current-log {
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border: 1px dashed #86efac;
      color: #15803d;
      font-size: 12px;
      font-weight: 700;
      border-radius: 14px;
      padding: 9px 12px;
      text-align: center;
      margin-bottom: 14px;
    }

    .btn-grid-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-small-action {
      padding: 14px 8px;
      border-radius: 18px;
      border: 1.5px solid var(--border-color);
      background: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      line-height: 1.3;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-small-action:active {
      transform: scale(0.95) translateY(1px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    .btn-small-action.day-btn {
      background: linear-gradient(150deg, #fffbeb, #fef3c7);
      border-color: #fcd34d;
      color: #b45309;
    }
    .btn-small-action.night-btn {
      background: linear-gradient(150deg, #eef2ff, #e0e7ff);
      border-color: #a5b4fc;
      color: #3730a3;
    }
    .btn-small-action.custom-btn {
      background: linear-gradient(150deg, #f0fdf4, #d1fae5);
      border-color: #86efac;
      color: #15803d;
    }
    .btn-small-action.danger-btn {
      background: linear-gradient(150deg, #fef2f2, #fee2e2);
      border-color: #fca5a5;
      color: #dc2626;
    }
    .btn-small-action.danger-btn.armed {
      background: linear-gradient(150deg, #ef4444, #dc2626);
      border-color: #dc2626;
      color: #fff;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
    }
    .sub-info {
      font-size: 10px;
      font-weight: normal;
      opacity: 0.85;
    }

    .form-group {
      margin-bottom: 11px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: #f9fafb;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary-green);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(47, 185, 138, 0.12);
    }
    .form-section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-green);
      margin: 14px 0 9px;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border-color);
    }
    .form-section-title:first-of-type {
      margin-top: 4px;
    }

    .data-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .data-actions .btn-small-action {
      padding: 11px 4px;
      font-size: 12px;
      border-radius: 14px;
    }

    .bottom-nav {

      right: 0;

  <script>
  (function () {
    'use strict';

    const KEY_LOGS = 'workLogs';
    const KEY_DAY = 'dayShiftConfig';
    const KEY_NIGHT = 'nightShiftConfig';

    const DEFAULT_DAY = { hours: 8, rate: 25, subsidy: 0 };
    const DEFAULT_NIGHT = { hours: 8, rate: 30, subsidy: 20 };

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, '0');
    const fmtDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

    const cleanNum = (n) => {
      const v = Number(n);
      if (!Number.isFinite(v)) return 0;
      return parseFloat(v.toFixed(10));
    };

    const toNum = (v, def = 0) => (Number.isFinite(Number(v)) ? Number(v) : def);
    const fmtMoney = (n) =>
      cleanNum(n).toLocaleString('zh-CN', { maximumFractionDigits: 10 });
    const fmtHours = (n) => String(cleanNum(n));

    const logIncome = (log) =>
      (Number(log.hours) || 0) * (Number(log.rate) || 0) + (Number(log.subsidy) || 0);

    function safeParse(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const val = JSON.parse(raw);
        return val === null || val === undefined ? fallback : val;
      } catch (e) {
        console.warn('[小账本] 本地数据解析失败：', key, e);
        return fallback;
      }
    }

    function normalizeConfig(raw, def) {
      if (!raw || typeof raw !== 'object') return Object.assign({}, def);
      return {
        hours: Math.max(0, toNum(raw.hours, def.hours)),
        rate: Math.max(0, toNum(raw.rate, def.rate)),
        subsidy: toNum(raw.subsidy, def.subsidy)
      };
    }

    function sanitizeLogs(raw) {
      const out = {};
      if (!raw || typeof raw !== 'object') return out;
      Object.keys(raw).forEach((key) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
        const l = raw[key];
        if (!l || typeof l !== 'object') return;
        const hours = Number(l.hours);
        if (!Number.isFinite(hours) || hours <= 0) return;
        out[key] = {
          type: ['day', 'night', 'custom'].indexOf(l.type) > -1 ? l.type : 'custom',
          hours: hours,
          rate: Math.max(0, toNum(l.rate, 0)),
          subsidy: toNum(l.subsidy, 0)
        };
      });
      return out;
    }

    let dayShiftConfig = normalizeConfig(safeParse(KEY_DAY, null), DEFAULT_DAY);
    let nightShiftConfig = normalizeConfig(safeParse(KEY_NIGHT, null), DEFAULT_NIGHT);
    let workLogs = sanitizeLogs(safeParse(KEY_LOGS, {}));

    function persistLogs() {
      try {
        localStorage.setItem(KEY_LOGS, JSON.stringify(workLogs));
      } catch (e) {
        toast('保存失败，存储空间可能已满');
      }
    }

    const now = new Date();
    const VIEW = { year: now.getFullYear(), month: now.getMonth() };
    const STAT = { year: now.getFullYear() };
    let selectedDateStr = '';
    let monthDetailTarget = null;

    let toastTimer = null;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
    }

    function renderCalendar() {
      const y = VIEW.year;
      const m = VIEW.month;

      $('monthRangeTitle').textContent = `${y}年${m + 1}月`;

      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const offset = (firstDay.getDay() + 6) % 7;
      const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;
      const todayStr = fmtDate(new Date());

      const frag = document.createDocumentFragment();

      for (let i = 0; i < totalCells; i++) {
        const d = new Date(y, m, i - offset + 1);
        const dateStr = fmtDate(d);
        const isOtherMonth = d.getMonth() !== m || d.getFullYear() !== y;
        const log = workLogs[dateStr];

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        if (isOtherMonth) cell.classList.add('other-month');
        if (dateStr === todayStr) cell.classList.add('today');
        cell.setAttribute('aria-label',
          dateStr + (log && log.hours > 0 ? '，已有打卡记录' : ''));

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = String(d.getDate());
        cell.appendChild(num);

        if (log && log.hours > 0) {
          const badge = document.createElement('div');
          badge.className = 'work-badge ' + (
            log.type === 'day' ? 'day-shift' :
            log.type === 'night' ? 'night-shift' : 'custom-shift'
          );
          const prefix = log.type === 'day' ? '白 ' : log.type === 'night' ? '夜 ' : '';
          badge.textContent = `${prefix}${fmtHours(log.hours)}h`;

          const inc = document.createElement('div');
          inc.className = 'income-text';
          inc.textContent = `¥${fmtMoney(logIncome(log))}`;

          cell.appendChild(badge);
          cell.appendChild(inc);
        }

        const onClick = () => handleDayClick(dateStr, d.getFullYear(), d.getMonth());
        cell.addEventListener('click', onClick);
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            onClick();
          }
        });

        frag.appendChild(cell);
      }

      const grid = $('daysGrid');
      grid.innerHTML = '';
      grid.appendChild(frag);

      renderMonthStats();
    }

    function handleDayClick(dateStr, year, month) {
      if (year !== VIEW.year || month !== VIEW.month) {
        VIEW.year = year;
        VIEW.month = month;
        renderCalendar();
      }
      openActionModal(dateStr);
    }

    function summarize(prefix) {
      let hours = 0, income = 0, days = 0, subsidy = 0;
      let dayCount = 0, nightCount = 0, customCount = 0;
      for (const ds in workLogs) {
        if (ds.indexOf(prefix) !== 0) continue;
        const log = workLogs[ds];
        if (!log || !(log.hours > 0)) continue;
        hours += Number(log.hours) || 0;
        income += logIncome(log);
        subsidy += Number(log.subsidy) || 0;
        days++;
        if (log.type === 'day') dayCount++;
        else if (log.type === 'night') nightCount++;
        else customCount++;
      }
      return {
        hours: cleanNum(hours),
        income: cleanNum(income),
        subsidy: cleanNum(subsidy),
        days: days,
        dayCount: dayCount,
        nightCount: nightCount,
        customCount: customCount
      };
    }

    function renderMonthStats() {
      const s = summarize(`${VIEW.year}-${pad2(VIEW.month + 1)}`);
      $('totalHours').textContent = fmtHours(s.hours);
      $('totalIncome').textContent = fmtMoney(s.income);
      $('totalDays').textContent = s.days;
      $('totalSubsidy').textContent = fmtMoney(s.subsidy);
    }

    function renderYearStats() {
      const y = STAT.year;
      $('currentYearTitle').textContent = `${y} 年`;

      const s = summarize(String(y));
      $('yearTotalHours').textContent = fmtHours(s.hours);
      $('yearTotalIncome').textContent = fmtMoney(s.income);
      $('yearTotalDays').textContent = s.days;
      $('yearDayCount').textContent = s.dayCount;
      $('yearNightCount').textContent = s.nightCount;

      if (openModals.indexOf('monthPickerModal') > -1) {
        renderMonthPicker();
      }
    }

    function renderMonthPicker() {
      const year = STAT.year;
      $('monthPickerTitle').textContent = `${year}年 · 选择月份`;
      $('monthPickerSub').textContent = '点击某个月查看详细数据';

      const grid = $('monthPickerGrid');
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();

      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      for (let m = 0; m < 12; m++) {
        const s = summarize(`${year}-${pad2(m + 1)}`);
        const item = document.createElement('div');
        item.className = 'month-pick-item';
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');

        if (s.days === 0) item.classList.add('empty');
        if (year === currentYear && m === currentMonth) item.classList.add('current');

        const num = document.createElement('div');
        num.className = 'month-pick-num';
        num.textContent = `${m + 1}月`;

        const hoursEl = document.createElement('div');
        hoursEl.className = 'month-pick-hours';
        hoursEl.textContent = s.days > 0
          ? `${fmtHours(s.hours)}h · ${s.days}天`
          : '无记录';

        item.appendChild(num);
        item.appendChild(hoursEl);

        const onClick = () => {
          closeModal('monthPickerModal');
          openMonthDetail(year, m);
        };
        item.addEventListener('click', onClick);
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            onClick();
          }
        });

        frag.appendChild(item);
      }

      grid.appendChild(frag);
    }

    function openMonthPicker() {
      renderMonthPicker();
      openModal('monthPickerModal');
    }

    function openMonthDetail(year, month) {
      monthDetailTarget = { year: year, month: month };
      const s = summarize(`${year}-${pad2(month + 1)}`);

      $('monthDetailTitle').textContent = `${year}年${month + 1}月`;
      $('mdIncome').textContent = `¥${fmtMoney(s.income)}`;
      $('mdHours').textContent = `${fmtHours(s.hours)}h`;
      $('mdDays').textContent = `${s.days}天`;
      $('mdDayCount').textContent = `${s.dayCount}天`;
      $('mdNightCount').textContent = `${s.nightCount}天`;
      $('mdCustomCount').textContent = `${s.customCount}天`;

      openModal('monthDetailModal');
    }

    function gotoMonthFromDetail() {
      if (!monthDetailTarget) return;
      const y = monthDetailTarget.year;
      const m = monthDetailTarget.month;

      closeModal('monthDetailModal');

      VIEW.year = y;
      VIEW.month = m;

      document.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
      const calNav = document.querySelector('.nav-item[data-target="calendarPage"]');
      if (calNav) calNav.classList.add('active');
      document.querySelectorAll('.page-section').forEach((sec) => sec.classList.remove('active'));
      $('calendarPage').classList.add('active');

      renderCalendar();
      toast(`已跳转到 ${y}年${m + 1}月`);
    }

    const openModals = [];

    function openModal(id) {
      const el = $(id);
      if (!el) return;
      el.classList.add('active');
      if (openModals.indexOf(id) === -1) openModals.push(id);
      document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
      const el = $(id);
      if (!el) return;
      el.classList.remove('active');
      const idx = openModals.indexOf(id);
      if (idx > -1) openModals.splice(idx, 1);
      if (openModals.length === 0) document.body.style.overflow = '';
      if (id === 'actionModal') resetClearButton();
    }

    function closeAllModals() {
      openModals.slice().forEach(closeModal);
    }

    function resetClearButton() {
      const btn = $('btnClearShift');
      btn.classList.remove('armed');
      $('clearShiftText').textContent = '🗑️ 清除打卡';
      clearTimeout(btn._armTimer);
    }

    function openActionModal(dateStr) {
      selectedDateStr = dateStr;
      $('actionModalTitle').textContent = `${dateStr} 打卡`;

      const d = dayShiftConfig;
      const n = nightShiftConfig;
      $('dayShiftSubText').textContent =
        `${fmtHours(d.hours)}h / ¥${d.rate} / 补${d.subsidy}`;
      $('nightShiftSubText').textContent =
        `${fmtHours(n.hours)}h / ¥${n.rate} / 补${n.subsidy}`;

      const log = workLogs[dateStr];
      const hasLog = !!(log && log.hours > 0);

      const info = $('currentLogInfo');
      if (hasLog) {
        const typeName = log.type === 'day' ? '白班' : log.type === 'night' ? '夜班' : '自定义';
        info.textContent =
          `当前记录：${typeName} ${fmtHours(log.hours)}h · ¥${fmtMoney(logIncome(log))}`;
        info.hidden = false;
      } else {
        info.hidden = true;
      }

      resetClearButton();
      $('btnClearShift').hidden = !hasLog;

      openModal('actionModal');
    }

    function applyPresetCheckin(type) {
      const cfg = type === 'day' ? dayShiftConfig : nightShiftConfig;
      workLogs[selectedDateStr] = {
        type: type,
        hours: cfg.hours,
        rate: cfg.rate,
        subsidy: cfg.subsidy
      };
      persistLogs();
      closeModal('actionModal');
      renderCalendar();
      if (isStatsActive()) renderYearStats();
      toast(`已记录 ${fmtHours(cfg.hours)}h ${type === 'day' ? '白班' : '夜班'}`);
    }

    function openCustomModal() {
      const existing = workLogs[selectedDateStr];
      const base = existing && existing.hours > 0
        ? existing
        : { hours: dayShiftConfig.hours, rate: dayShiftConfig.rate, subsidy: dayShiftConfig.subsidy };

      $('customModalTitle').textContent = `${selectedDateStr} 自定义打卡`;
      $('customHoursInput').value = fmtHours(base.hours);
      $('customRateInput').value = base.rate;
      $('customSubsidyInput').value = base.subsidy || 0;

      openModal('customModal');
      setTimeout(() => {
        const input = $('customHoursInput');
        input.focus();
        input.select && input.select();
      }, 120);
    }

    function saveCustomCheckin() {
      const hours = parseFloat($('customHoursInput').value);
      const rateRaw = parseFloat($('customRateInput').value);
      const subsidyRaw = parseFloat($('customSubsidyInput').value);

      if (!Number.isFinite(hours) || hours <= 0) {
        toast('请输入有效的工时');
        $('customHoursInput').focus();
        return;
      }

      workLogs[selectedDateStr] = {
        type: 'custom',
        hours: hours,
        rate: Number.isFinite(rateRaw) ? Math.max(0, rateRaw) : dayShiftConfig.rate,
        subsidy: Number.isFinite(subsidyRaw) ? subsidyRaw : 0
      };

      persistLogs();
      closeModal('customModal');
      renderCalendar();
      if (isStatsActive()) renderYearStats();
      toast('已保存自定义打卡');
    }

    function onClearClick() {
      const btn = $('btnClearShift');

      if (!btn.classList.contains('armed')) {
        btn.classList.add('armed');
        $('clearShiftText').textContent = '⚠️ 再点一次确认删除';
        clearTimeout(btn._armTimer);
        btn._armTimer = setTimeout(resetClearButton, 3000);
        return;
      }

      delete workLogs[selectedDateStr];
      persistLogs();
      resetClearButton();
      closeModal('actionModal');
      renderCalendar();
      if (isStatsActive()) renderYearStats();
      toast('已删除该日记录');
    }

    function openSettingsModal() {
      $('dayHoursInput').value = dayShiftConfig.hours;
      $('dayRateInput').value = dayShiftConfig.rate;
      $('daySubsidyInput').value = dayShiftConfig.subsidy;

      $('nightHoursInput').value = nightShiftConfig.hours;
      $('nightRateInput').value = nightShiftConfig.rate;
      $('nightSubsidyInput').value = nightShiftConfig.subsidy;

      openModal('settingsModal');
    }

    function readNumber(id, fallback, min) {
      const v = parseFloat($(id).value);
      if (!Number.isFinite(v)) return fallback;
      return min !== undefined ? Math.max(min, v) : v;
    }

    function saveSettings() {
      const prevDay = Object.assign({}, dayShiftConfig);
      const prevNight = Object.assign({}, nightShiftConfig);

      dayShiftConfig = {
        hours: readNumber('dayHoursInput', prevDay.hours, 0),
        rate: readNumber('dayRateInput', prevDay.rate, 0),
        subsidy: readNumber('daySubsidyInput', prevDay.subsidy)
      };
      nightShiftConfig = {
        hours: readNumber('nightHoursInput', prevNight.hours, 0),
        rate: readNumber('nightRateInput', prevNight.rate, 0),
        subsidy: readNumber('nightSubsidyInput', prevNight.subsidy)
      };

      try {
        localStorage.setItem(KEY_DAY, JSON.stringify(dayShiftConfig));
        localStorage.setItem(KEY_NIGHT, JSON.stringify(nightShiftConfig));
      } catch (e) {
        toast('保存失败，存储空间可能已满');
      }

      closeModal('settingsModal');
      renderCalendar();
      toast('默认参数已更新');
    }

    function exportData() {
      const payload = {
        app: 'HeyYu',
        version: 1,
        exportedAt: new Date().toISOString(),
        dayShiftConfig: dayShiftConfig,
        nightShiftConfig: nightShiftConfig,
        logs: workLogs
      };

      try {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `工时记账-${fmtDate(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast('备份已导出');
      } catch (e) {
        toast('导出失败，请稍后再试');
      }
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = function () {
        let data;
        try {
          data = JSON.parse(String(reader.result));
        } catch (e) {
          toast('导入失败：不是有效的 JSON 文件');
          return;
        }

        if (!data || typeof data !== 'object') {
          toast('导入失败：文件内容格式不正确');
          return;
        }

        const rawLogs = data.logs && typeof data.logs === 'object' ? data.logs : data;
        const logs = sanitizeLogs(rawLogs);

        if (Object.keys(logs).length === 0) {
          toast('导入失败：未找到有效记录');
          return;
        }

        if (!confirm(`将导入 ${Object.keys(logs).length} 条记录，是否覆盖当前全部数据？`)) {
          return;
        }

        workLogs = logs;
        if (data.dayShiftConfig) dayShiftConfig = normalizeConfig(data.dayShiftConfig, dayShiftConfig);
        if (data.nightShiftConfig) nightShiftConfig = normalizeConfig(data.nightShiftConfig, nightShiftConfig);

        persistLogs();
        try {
          localStorage.setItem(KEY_DAY, JSON.stringify(dayShiftConfig));
          localStorage.setItem(KEY_NIGHT, JSON.stringify(nightShiftConfig));
        } catch (e) { /* 忽略 */ }

        closeModal('settingsModal');
        renderCalendar();
        renderYearStats();
        toast('导入成功');
      };
      reader.onerror = function () {
        toast('导入失败：文件读取异常');
      };
      reader.readAsText(file);
    }

    function clearAllData() {
      if (!confirm('确定要清空全部打卡记录吗？此操作不可恢复，建议先导出备份。')) return;
      if (!confirm('再次确认：所有工时记录将被永久删除。')) return;

      workLogs = {};
      persistLogs();
      closeModal('settingsModal');
      renderCalendar();
      renderYearStats();
      toast('已清空全部记录');
    }

    function changeMonth(delta) {
      let m = VIEW.month + delta;
      let y = VIEW.year;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      VIEW.year = y;
      VIEW.month = m;
      renderCalendar();
      if (isStatsActive()) renderYearStats();
    }

    function changeStatYear(delta) {
      STAT.year += delta;
      renderYearStats();
    }

    function isStatsActive() {
      return $('statsPage').classList.contains('active');
    }

    function initNavigation() {
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach((item) => {
        item.addEventListener('click', () => {
          const targetId = item.getAttribute('data-target');
          if (item.classList.contains('active')) return;

          navItems.forEach((n) => n.classList.remove('active'));
          item.classList.add('active');

          document.querySelectorAll('.page-section').forEach((sec) => sec.classList.remove('active'));
          $(targetId).classList.add('active');

          if (targetId === 'statsPage') {
            renderYearStats();
          } else {
            renderCalendar();
          }
        });
      });
    }

    function bindEvents() {
      $('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
      $('nextMonthBtn').addEventListener('click', () => changeMonth(1));

      $('prevYearBtn').addEventListener('click', () => changeStatYear(-1));
      $('nextYearBtn').addEventListener('click', () => changeStatYear(1));

      $('openSettingsBtn').addEventListener('click', openSettingsModal);
      $('saveSettingsBtn').addEventListener('click', saveSettings);

      $('openMonthPickerBtn').addEventListener('click', openMonthPicker);
      $('gotoMonthBtn').addEventListener('click', gotoMonthFromDetail);

      $('btnDayShift').addEventListener('click', () => applyPresetCheckin('day'));
      $('btnNightShift').addEventListener('click', () => applyPresetCheckin('night'));
      $('btnCustomShift').addEventListener('click', () => {
        closeModal('actionModal');
        openCustomModal();
      });
      $('btnClearShift').addEventListener('click', onClearClick);
      $('saveCustomBtn').addEventListener('click', saveCustomCheckin);

      ['customHoursInput', 'customRateInput', 'customSubsidyInput'].forEach((id) => {
        $(id).addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveCustomCheckin();
          }
        });
      });

      $('exportBtn').addEventListener('click', exportData);
      $('importBtn').addEventListener('click', () => $('importFile').click());
      $('importFile').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) importData(file);
        e.target.value = '';
      });
      $('clearAllBtn').addEventListener('click', clearAllData);

      document.querySelectorAll('[data-close]').forEach((btn) => {
        btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close')));
      });

      document.querySelectorAll('.modal').forEach((modal) => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeModal(modal.id);
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && openModals.length > 0) {
          closeModal(openModals[openModals.length - 1]);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      initNavigation();
      bindEvents();
      renderCalendar();
      renderYearStats();
    });
  })();
  </script>
</body>
</html>
